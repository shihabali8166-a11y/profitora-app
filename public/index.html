<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONLINE_INCOME_2027 Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-align: center;
    }
    h2 { color: #38bdf8; margin-bottom: 5px; }
    p { color: #94a3b8; font-size: 14px; }
    .card {
      background: #334155;
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
      font-size: 18px;
      font-weight: bold;
    }
    .btn {
      width: 100%;
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:active { background: #0284c7; }
  </style>
</head>
<body>

  <div class="container">
    <h2>ONLINE_INCOME_2027</h2>
    <p>আপনার ড্যাশবোর্ড ও আর্নিং স্ট্যাটাস</p>

    <div class="card">
      💰 Balance: <span id="userBalance">0.00</span> BDT
    </div>

    <button class="btn" onclick="openBot()">বট মেনুতে ফিরে যান</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('userBalance').innerText = "10.00";
    }

    function openBot() {
      tg.close();
    }
  </script>

</body>
</html>
